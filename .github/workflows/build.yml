name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IDA_SDK_REF: v9.5.0-release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            lib: tensorlens.dll
          - os: ubuntu-22.04
            lib: tensorlens.so
          - os: macos-14
            lib: tensorlens.dylib
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HexRaysSA/ida-sdk
          ref: ${{ env.IDA_SDK_REF }}
          path: ida-sdk
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DIDASDK="$GITHUB_WORKSPACE/ida-sdk" -DIDABIN="$GITHUB_WORKSPACE/build/idabin" \
            "${{ matrix.cmake_extra }}"
      - name: Build
        run: cmake --build build
      - name: Test core
        run: ctest --test-dir build --output-on-failure
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp build/idabin/plugins/${{ matrix.lib }} dist/
          cp build/tensorlens-scan* dist/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: tensorlens-${{ runner.os }}
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          set -e
          mkdir -p pkg/tensorlens/docs
          cp ida-plugin.json README.md LICENSE pkg/tensorlens/
          cp docs/logo.png pkg/tensorlens/docs/
          cp artifacts/*/tensorlens.dll artifacts/*/tensorlens.so artifacts/*/tensorlens.dylib pkg/tensorlens/
          (cd pkg/tensorlens && zip -r "$GITHUB_WORKSPACE/tensorlens-${GITHUB_REF_NAME}.zip" .)
          for os in Windows Linux macOS; do
            (cd artifacts/tensorlens-$os && zip "$GITHUB_WORKSPACE/tensorlens-scan-${GITHUB_REF_NAME}-$os.zip" tensorlens-scan*)
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tensorlens-*.zip
